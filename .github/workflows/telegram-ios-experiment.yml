name: Telegram-iOS unsigned IPA (experiment)

# РЎР±РѕСЂРєР° РІР°РЅРёР»СЊРЅРѕРіРѕ Telegram-iOS РІ .ipa РЅР° macOS-СЂР°РЅРЅРµСЂРµ Р±РµР· Apple-Р°РєРєР°СѓРЅС‚Р°.
# РСЃРїРѕР»СЊР·СѓСЋС‚СЃСЏ С€С‚Р°С‚РЅС‹Рµ "С„РµР№РєРѕРІС‹Рµ" РїСЂРѕС„РёР»Рё РёР· build-system/fake-codesigning
# (self-signed СЃРµСЂС‚РёС„РёРєР°С‚) вЂ” РїСЂРёР»РѕР¶РµРЅРёРµ РїРѕРґРїРёСЃС‹РІР°РµС‚СЃСЏ СЃР°РјРѕРїРѕРґРїРёСЃР°РЅРЅС‹Рј СЃРµСЂС‚РѕРј,
# Р° Sideloadly РїРµСЂРµРїРѕРґРїРёС€РµС‚ РµРіРѕ С‚РІРѕРёРј Р±РµСЃРїР»Р°С‚РЅС‹Рј Apple ID РїСЂРё СѓСЃС‚Р°РЅРѕРІРєРµ.
#
# РЎРµРєСЂРµС‚С‹ (РЅСѓР¶РЅС‹ С‚РѕР»СЊРєРѕ РґР»СЏ РІС…РѕРґР° РІ Р°РєРєР°СѓРЅС‚ Telegram РІ РїСЂРёР»РѕР¶РµРЅРёРё):
#   TELEGRAM_API_ID, TELEGRAM_API_HASH вЂ” СЃ https://my.telegram.org/apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Toolchain and capacity
        run: |
          sw_vers
          xcodebuild -version
          df -h /
          echo "cores: $(sysctl -n hw.ncpu)  ram: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"

      - name: Clone Telegram-iOS
        run: |
          git clone --depth=1 --recursive --shallow-submodules -j8 \
            https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios
          du -sh telegram-ios

      - name: Configure
        working-directory: telegram-ios
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          API_ID="${API_ID:-1}"
          API_HASH="${API_HASH:-0123456789abcdef0123456789abcdef}"
          # bundle_id Рё team_id РґРѕР»Р¶РЅС‹ СЃРѕРІРїР°РґР°С‚СЊ СЃ РїСЂРѕС„РёР»СЏРјРё РёР·
          # build-system/fake-codesigning/profiles (С‚Р°Рј ph.telegra.Telegraph / C67CF9S4VU)
          cat > build-system/ci-configuration.json <<JSON
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "$API_ID",
            "api_hash": "$API_HASH",
            "team_id": "C67CF9S4VU",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          JSON
          cat build-system/ci-configuration.json

      - name: Import self-signed certificate
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          security create-keychain -p build build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p build build.keychain
          security list-keychains -d user -s build.keychain "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s build.keychain
          security import build-system/fake-codesigning/certs/SelfSigned.p12 \
            -k build.keychain -P "" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k build build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Generate Xcode project
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/bazel-cache" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            generateProject \
            --configurationPath=build-system/ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableExtensions \
            --buildNumber=100001 \
            2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Build with xcodebuild
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          PROJ="$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          echo "project: $PROJ"
          test -n "$PROJ"
          xcodebuild -list -project "$PROJ" | tee -a "$GITHUB_WORKSPACE/build.log"

          xcodebuild \
            -project "$PROJ" \
            -scheme Telegram \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="$(find telegram-ios -path '*/Build/Products/*' -maxdepth 8 -name '*.app' -type d -print -quit)"
          echo "app: $APP_PATH"
          test -n "$APP_PATH"

          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | head -10 || true

          rm -rf out && mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry telegram-unsigned.ipa Payload
          ls -lh telegram-unsigned.ipa

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-unsigned-ipa
          path: out/telegram-unsigned.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
