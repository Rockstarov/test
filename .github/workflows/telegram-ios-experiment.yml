name: Telegram-iOS unsigned IPA (experiment)

# РџСЂРѕР±Р°: СЃРѕР±СЂР°С‚СЊ Telegram-iOS РІ РЅРµРїРѕРґРїРёСЃР°РЅРЅС‹Р№ .ipa РЅР° macOS-СЂР°РЅРЅРµСЂРµ.
# Р­С‚Рѕ РќР• AyuGram вЂ” РІР°РЅРёР»СЊРЅС‹Р№ Telegram, С„РёС‡Рё AyuGram РІ iOS-РєРѕРґРµ РѕС‚СЃСѓС‚СЃС‚РІСѓСЋС‚.
#
# РќСѓР¶РЅС‹ СЃРµРєСЂРµС‚С‹ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ:
#   TELEGRAM_API_ID   вЂ” С‡РёСЃР»Рѕ СЃ https://my.telegram.org/apps
#   TELEGRAM_API_HASH вЂ” СЃС‚СЂРѕРєР° РѕС‚С‚СѓРґР° Р¶Рµ
# Р‘РµР· РЅРёС… РїРѕРґСЃС‚Р°РІРёС‚СЃСЏ Р·Р°РіР»СѓС€РєР°: СЃР±РѕСЂРєР° РїСЂРѕР№РґС‘С‚, РІС…РѕРґ РІ Р°РєРєР°СѓРЅС‚ вЂ” РЅРµС‚.

on:
  workflow_dispatch:
    inputs:
      xcode_override:
        description: "Р’РµСЂСЃРёСЏ Xcode РґР»СЏ --overrideXcodeVersion (РїСѓСЃС‚Рѕ = Р°РІС‚РѕРѕРїСЂРµРґРµР»РµРЅРёРµ)"
        required: false
        default: ""
      bazel_override:
        description: "Р’РµСЂСЃРёСЏ Bazel РґР»СЏ --overrideBazelVersion"
        required: false
        default: "9.2.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Toolchain and capacity
        run: |
          sw_vers
          xcodebuild -version
          df -h /
          echo "cores: $(sysctl -n hw.ncpu)  ram: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"

      - name: Clone Telegram-iOS
        run: |
          git clone --depth=1 --recursive --shallow-submodules -j8 \
            https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios
          du -sh telegram-ios

      - name: Configure
        working-directory: telegram-ios
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          API_ID="${API_ID:-1}"
          API_HASH="${API_HASH:-0123456789abcdef0123456789abcdef}"
          cat > build-system/ci-configuration.json <<JSON
          {
            "bundle_id": "com.example.tgclone.Telegram",
            "api_id": "$API_ID",
            "api_hash": "$API_HASH",
            "team_id": "XXXXXXXXXX",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          JSON
          cat build-system/ci-configuration.json

      - name: Build (Bazel)
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          XCODE_VER="${{ inputs.xcode_override }}"
          if [ -z "$XCODE_VER" ]; then
            XCODE_VER="$(xcodebuild -version | head -1 | awk '{print $2}')"
          fi
          echo "Using Xcode override: $XCODE_VER"
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/bazel-cache" \
            build \
            --configurationPath=build-system/ci-configuration.json \
            --disableProvisioningProfiles \
            --disableExtensions \
            --buildNumber=100001 \
            --configuration=release_arm64 \
            --overrideBazelVersion="${{ inputs.bazel_override }}" \
            --overrideXcodeVersion="$XCODE_VER" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Locate .app
        run: |
          find telegram-ios -maxdepth 8 -name '*.app' -type d | head -20
          find telegram-ios -maxdepth 8 -name '*.app' -type d | head -1 > app-path.txt
          cat app-path.txt

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="$(cat app-path.txt)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::.app РЅРµ РЅР°Р№РґРµРЅ вЂ” СЃРјРѕС‚СЂРё build.log"
            exit 1
          fi
          codesign --force --sign - "$APP_PATH" || true
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | head -10 || true

          rm -rf out && mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry telegram-unsigned.ipa Payload
          ls -lh telegram-unsigned.ipa

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-unsigned-ipa
          path: out/telegram-unsigned.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
