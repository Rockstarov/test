name: Telegram-iOS unsigned IPA (experiment)

# РџСЂРѕР±Р°: СЃРѕР±СЂР°С‚СЊ Telegram-iOS РІ РЅРµРїРѕРґРїРёСЃР°РЅРЅС‹Р№ .ipa РЅР° macOS-СЂР°РЅРЅРµСЂРµ.
# Р­С‚Рѕ РќР• AyuGram вЂ” РІР°РЅРёР»СЊРЅС‹Р№ Telegram, С„РёС‡Рё AyuGram РІ iOS-РєРѕРґРµ РѕС‚СЃСѓС‚СЃС‚РІСѓСЋС‚.
#
# РЎРµРєСЂРµС‚С‹ (РЅРµРѕР±СЏР·Р°С‚РµР»СЊРЅС‹ РґР»СЏ СЃР±РѕСЂРєРё, РЅСѓР¶РЅС‹ РґР»СЏ РІС…РѕРґР° РІ Р°РєРєР°СѓРЅС‚):
#   TELEGRAM_API_ID, TELEGRAM_API_HASH вЂ” СЃ https://my.telegram.org/apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Toolchain and capacity
        run: |
          sw_vers
          xcodebuild -version
          df -h /
          echo "cores: $(sysctl -n hw.ncpu)  ram: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"

      - name: Clone Telegram-iOS
        run: |
          git clone --depth=1 --recursive --shallow-submodules -j8 \
            https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios
          du -sh telegram-ios

      - name: Configure
        working-directory: telegram-ios
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          API_ID="${API_ID:-1}"
          API_HASH="${API_HASH:-0123456789abcdef0123456789abcdef}"
          cat > build-system/ci-configuration.json <<JSON
          {
            "bundle_id": "com.example.tgclone.Telegram",
            "api_id": "$API_ID",
            "api_hash": "$API_HASH",
            "team_id": "XXXXXXXXXX",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          JSON
          cat build-system/ci-configuration.json

      - name: Disable provisioning profiles in bazelrc
        working-directory: telegram-ios
        run: |
          echo 'common --//Telegram:disableProvisioningProfiles' >> .bazelrc
          echo 'common --//Telegram:disableExtensions' >> .bazelrc

      - name: Generate Xcode project
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          SIGN_DIR=build-system/empty-signing
          mkdir -p "$SIGN_DIR/profiles" "$SIGN_DIR/certs"

          # Make.py С‚СЂРµР±СѓРµС‚ aps-environment РІ РїСЂРѕС„РёР»Рµ, РЅРѕ Bazel РїСЂРѕС„РёР»Рё РЅРµ РёСЃРїРѕР»СЊР·СѓРµС‚
          # (РѕС‚РєР»СЋС‡РµРЅС‹ С‡РµСЂРµР· --//Telegram:disableProvisioningProfiles). Р”РµР»Р°РµРј С„РµР№РєРѕРІС‹Р№.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$SIGN_DIR/key.pem" -out "$SIGN_DIR/cert.pem" -subj "/CN=fake" >/dev/null 2>&1
          cat > "$SIGN_DIR/profile.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Entitlements</key>
            <dict>
              <key>application-identifier</key>
              <string>XXXXXXXXXX.com.example.tgclone.Telegram</string>
              <key>aps-environment</key>
              <string>development</string>
            </dict>
          </dict>
          </plist>
          PLIST
          openssl smime -sign -binary -nodetach -in "$SIGN_DIR/profile.plist" \
            -signer "$SIGN_DIR/cert.pem" -inkey "$SIGN_DIR/key.pem" \
            -outform der -out "$SIGN_DIR/profiles/fake.mobileprovision"

          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/bazel-cache" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            generateProject \
            --configurationPath=build-system/ci-configuration.json \
            --codesigningInformationPath=build-system/empty-signing \
            --disableProvisioningProfiles \
            --buildNumber=100001 \
            2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          if [ -f xcodeproj.bazelrc ]; then
            echo 'build --//Telegram:disableProvisioningProfiles' >> xcodeproj.bazelrc
            echo 'build --//Telegram:disableExtensions' >> xcodeproj.bazelrc
          fi

      - name: Build with xcodebuild
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          PROJ="$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          echo "project: $PROJ"
          test -n "$PROJ"
          xcodebuild -list -project "$PROJ" | tee -a "$GITHUB_WORKSPACE/build.log"

          xcodebuild \
            -project "$PROJ" \
            -scheme Telegram \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="$(find telegram-ios -path '*/Build/Products/*' -maxdepth 8 -name '*.app' -type d -print -quit)"
          echo "app: $APP_PATH"
          test -n "$APP_PATH"

          codesign --force --sign - "$APP_PATH" || true
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | head -5 || true

          rm -rf out && mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry telegram-unsigned.ipa Payload
          ls -lh telegram-unsigned.ipa

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-unsigned-ipa
          path: out/telegram-unsigned.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
