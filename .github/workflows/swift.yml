name: iOS demo unsigned IPA

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          mkdir -p build
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

          cd demo-ios
          xcodegen generate
          cd ..

          xcodebuild archive \
            -project demo-ios/DemoApp.xcodeproj \
            -scheme DemoApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DemoApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee build.log

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DemoApp.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "App: $APP_PATH"

          # Ad-hoc РїРѕРґРїРёСЃСЊ: РґРѕР±Р°РІР»СЏРµС‚ LC_CODE_SIGNATURE, Р±РµР· РєРѕС‚РѕСЂРѕРіРѕ
          # Sideloadly РЅРµ РјРѕР¶РµС‚ РїРµСЂРµРїРѕРґРїРёСЃР°С‚СЊ Р±Р°РЅРґР» РїРѕРґ Apple ID.
          codesign --force --sign - "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | head -10 || true

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"

          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: demo-unsigned-ipa
          path: out/app-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
